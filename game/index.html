<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="The Quiet Stacks — a top-down stealth heist in an old university library. Steal three manuscripts and escape unseen.">
<title>The Quiet Stacks — a library stealth heist</title>
<style>

</style>

<canvas id="game" aria-label="The Quiet Stacks: sneak through the library, steal three rare manuscripts and escape through the reading-room window unseen"></canvas>
<p id="status" role="status" aria-live="polite"></p>
